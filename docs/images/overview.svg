<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title description">
<title id="title">Codex 会话修复功能总览</title><desc id="description">六类功能：会话、配置登录、损坏历史、全量检查、清理和运行态诊断。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c86640"/></marker></defs>
<rect width="1200" height="730" fill="#f7f3ea"/><text x="52" y="65" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="42" fill="#193f4b" font-weight="700" text-anchor="start">Codex 会话报错，先查清楚再修</text><text x="54" y="110" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#536c75" font-weight="400" text-anchor="start">codex-session-repair · 处理本机会话和配置，不修改项目业务代码</text><rect x="52" y="155" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="76" y="179" width="46" height="40" rx="12" fill="#367d74" stroke="#367d74" stroke-width="2"/><text x="99" y="207" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">01</text><text x="76" y="261" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">会话报错修复</text><text x="76" y="302" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">旧 provider、缺少 call_id</text><text x="76" y="334" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">分页缓存与原始历史同步</text><rect x="428" y="155" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="452" y="179" width="46" height="40" rx="12" fill="#3577a6" stroke="#3577a6" stroke-width="2"/><text x="475" y="207" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">02</text><text x="452" y="261" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">配置与登录恢复</text><text x="452" y="302" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">检查 TOML 和指令文件路径</text><text x="452" y="334" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">登录文件丢失时查本地备份</text><rect x="804" y="155" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="828" y="179" width="46" height="40" rx="12" fill="#c86640" stroke="#c86640" stroke-width="2"/><text x="851" y="207" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">03</text><text x="828" y="261" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">损坏历史处理</text><text x="828" y="302" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">定位截断 JSON、NUL 填充</text><text x="828" y="334" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">先备份；坏行不能凭空补回</text><rect x="52" y="389" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="76" y="413" width="46" height="40" rx="12" fill="#3577a6" stroke="#3577a6" stroke-width="2"/><text x="99" y="441" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">04</text><text x="76" y="495" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">一次检查全会话</text><text x="76" y="536" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">扫描全部未归档会话</text><text x="76" y="568" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">中文摘要 + 详细检查报告</text><rect x="428" y="389" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="452" y="413" width="46" height="40" rx="12" fill="#c86640" stroke="#c86640" stroke-width="2"/><text x="475" y="441" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">05</text><text x="452" y="495" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">归档与备份清理</text><text x="452" y="536" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">预览后清理归档、重复备份</text><text x="452" y="568" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">只清理工具识别的目标</text><rect x="804" y="389" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="828" y="413" width="46" height="40" rx="12" fill="#367d74" stroke="#367d74" stroke-width="2"/><text x="851" y="441" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">06</text><text x="828" y="495" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">分清问题出在哪</text><text x="828" y="536" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">1210：给出兼容性处理指引</text><text x="828" y="568" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">明确过载：等待后再重试</text><rect x="52" y="638" width="1096" height="62" rx="16" fill="#193f4b" stroke="#193f4b" stroke-width="2"/><text x="80" y="678" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="400" text-anchor="start">默认先检查 → 确认范围 → 备份处理 → 静态检查 + 真实续聊验证</text></svg>
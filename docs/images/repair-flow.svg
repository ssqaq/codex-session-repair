<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title description">
<title id="title">Codex 会话修复操作流程</title><desc id="description">只读检查、确认范围、备份处理、静态验证、真实续聊。预检或上游问题应停止。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c86640"/></marker></defs>
<rect width="1200" height="770" fill="#f7f3ea"/><text x="52" y="65" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="42" fill="#193f4b" font-weight="700" text-anchor="start">从“报错了”到“能继续聊”，怎么走</text><text x="54" y="110" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#536c75" font-weight="400" text-anchor="start">能处理的按范围修复；服务端问题和不确定的损坏会停下来说明原因</text><rect x="52" y="155" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="76" y="179" width="46" height="40" rx="12" fill="#367d74" stroke="#367d74" stroke-width="2"/><text x="99" y="207" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">01</text><text x="76" y="261" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">先做只读检查</text><text x="76" y="302" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">查看报错和最近一轮</text><text x="76" y="334" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">扫描会话、配置、历史</text><rect x="428" y="155" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="452" y="179" width="46" height="40" rx="12" fill="#3577a6" stroke="#3577a6" stroke-width="2"/><text x="475" y="207" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">02</text><text x="452" y="261" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">说明问题和范围</text><text x="452" y="302" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">列出哪里坏、要改哪里</text><text x="452" y="334" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">需要你补信息时先停下</text><rect x="804" y="155" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="828" y="179" width="46" height="40" rx="12" fill="#c86640" stroke="#c86640" stroke-width="2"/><text x="851" y="207" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">03</text><text x="828" y="261" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">确认后备份处理</text><text x="828" y="302" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">只改确认的文件和会话</text><text x="828" y="334" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">离线恢复需先退出 Codex</text><polyline points="396,255 419,255" fill="none" stroke="#c86640" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="772,255 795,255" fill="none" stroke="#c86640" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="428" y="435" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="452" y="459" width="46" height="40" rx="12" fill="#3577a6" stroke="#3577a6" stroke-width="2"/><text x="475" y="487" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">04</text><text x="452" y="541" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">检查修复结果</text><text x="452" y="582" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">核对数据库、历史和缓存</text><text x="452" y="614" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">失败按工具报告恢复</text><rect x="804" y="435" width="344" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="828" y="459" width="46" height="40" rx="12" fill="#367d74" stroke="#367d74" stroke-width="2"/><text x="851" y="487" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">05</text><text x="828" y="541" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">回到 Codex 试聊</text><text x="828" y="582" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">重开或刷新目标会话</text><text x="828" y="614" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">真实续聊成功才算修好</text><polyline points="976,359 976,395 600,395 600,425" fill="none" stroke="#c86640" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="772,535 795,535" fill="none" stroke="#c86640" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="52" y="435" width="344" height="204" rx="20" fill="#efe8dc" stroke="#ded3c0" stroke-width="2"/><text x="76" y="485" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="27" fill="#193f4b" font-weight="700" text-anchor="start">这些情况先停下</text><text x="76" y="529" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">预检失败、候选不唯一</text><text x="76" y="564" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">1210、明确服务端过载</text><text x="76" y="599" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">按报告处理后再检查</text><rect x="52" y="679" width="1096" height="62" rx="16" fill="#193f4b" stroke="#193f4b" stroke-width="2"/><text x="80" y="719" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="400" text-anchor="start">检查通过 ≠ 已经能用；配置修复后重启，登录恢复后验证浏览器。</text></svg>
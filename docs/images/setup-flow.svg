<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 0 1200 742" role="img" aria-labelledby="title description">
<title id="title">Codex 会话修复安装与调用流程</title><desc id="description">下载、安装到用户级技能目录、重开 Codex、显式调用技能做只读检查。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c86640"/></marker></defs>
<rect width="1200" height="742" fill="#f7f3ea"/><text x="52" y="65" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="42" fill="#193f4b" font-weight="700" text-anchor="start">安装一次，以后在 Codex 里直接说</text><text x="54" y="110" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#536c75" font-weight="400" text-anchor="start">Windows 使用步骤 · 首次准备 Node.js、sqlite3 CLI、Python 3.11+</text><rect x="52" y="155" width="520" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="76" y="179" width="46" height="40" rx="12" fill="#367d74" stroke="#367d74" stroke-width="2"/><text x="99" y="207" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">01</text><text x="76" y="261" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">下载完整仓库</text><text x="76" y="302" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">点击 Code → Download ZIP</text><text x="76" y="334" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">解压后保留完整目录</text><rect x="628" y="155" width="520" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="652" y="179" width="46" height="40" rx="12" fill="#3577a6" stroke="#3577a6" stroke-width="2"/><text x="675" y="207" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">02</text><text x="652" y="261" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">放入 Skill 目录</text><text x="652" y="302" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">用户目录下 .codex/skills/</text><text x="652" y="334" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">文件夹名 codex-session-repair</text><rect x="52" y="405" width="520" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="76" y="429" width="46" height="40" rx="12" fill="#c86640" stroke="#c86640" stroke-width="2"/><text x="99" y="457" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">03</text><text x="76" y="511" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">重开 Codex</text><text x="76" y="552" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">在技能列表里确认可见</text><text x="76" y="584" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">安装本身不会修复会话</text><rect x="628" y="405" width="520" height="204" rx="20" fill="white" stroke="#d7e1df" stroke-width="2"/><rect x="652" y="429" width="46" height="40" rx="12" fill="#367d74" stroke="#367d74" stroke-width="2"/><text x="675" y="457" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">04</text><text x="652" y="511" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="28" fill="#193f4b" font-weight="700" text-anchor="start">说出要检查什么</text><text x="652" y="552" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">点名 $codex-session-repair</text><text x="652" y="584" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="21" fill="#536c75" font-weight="400" text-anchor="start">先检查、给报告，再定修复范围</text><polyline points="572,257 617,257" fill="none" stroke="#c86640" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="888,359 888,383 312,383 312,395" fill="none" stroke="#c86640" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="572,507 617,507" fill="none" stroke="#c86640" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="52" y="650" width="1096" height="62" rx="16" fill="#193f4b" stroke="#193f4b" stroke-width="2"/><text x="80" y="690" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23" fill="#fff" font-weight="400" text-anchor="start">直接说：使用 $codex-session-repair 检查全部未归档会话，先不修改。</text></svg>